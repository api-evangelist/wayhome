aid: wayhome
name: Wayhome
description: >-
  Wayhome (formerly Unmortgage) is a London-based property technology company founded in
  2016 by Nigel Purves and Josef Wasinski. It offers "Gradual Homeownership" — a part-buy,
  part-rent alternative to a traditional mortgage in which a customer buys at least 5% of a
  home and pays rent on the remainder, gradually increasing their ownership stake over time.
  Wayhome pairs aspiring homeowners with institutional investors (including Allianz), letting
  people who can afford rent but cannot secure a conventional mortgage move into a home of
  their choice with a deposit as low as 5%. Wayhome is authorised and regulated in the United
  Kingdom. It is backed by fintech venture investors including Anthemis, Augmentum Fintech,
  Allianz X and Accelerated Digital Ventures. Wayhome operates as a consumer-facing service and
  does not publish a public developer API; this profile captures its public web, security, and
  domain-security surface.
